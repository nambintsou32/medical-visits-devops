apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-visits-app
  namespace: medical-visits
  labels:
    app.kubernetes.io/name: medical-visits-app
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: medical-visits
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: medical-visits-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medical-visits-app
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: medical-visits
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: medical-visits
          image: ghcr.io/nambintsou32/medical-visits:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DB_URL
              value: >-
                jdbc:mysql://medical-visits-mysql.medical-visits.svc.cluster.local:3306/medical_visits
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: medical-visits-mysql
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medical-visits-mysql
                  key: MYSQL_PASSWORD
            - name: HIBERNATE_DDL_AUTO
              value: validate
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
